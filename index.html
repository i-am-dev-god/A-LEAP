<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object Detection AI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    #video-container {
      position: relative;
      width: 640px;
      height: 480px;
      margin: 0 auto;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #status {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #00ffcc;
    }
    #controls {
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      background: #00ffcc;
      color: #111;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #00ccaa;
    }
    .loading {
      color: #ffcc00;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.0.1/dist/index.js"></script>
</head>
<body>
  <h1>Object Detection AI</h1>
  <p>Hold an object in front of the camera to detect it.</p>
  
  <div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="overlay">
      <canvas id="canvas"></canvas>
    </div>
  </div>
  
  <div id="status">Initializing camera...</div>
  
  <div id="controls">
    <button id="startBtn" disabled>Start Camera</button>
    <button id="stopBtn" disabled>Stop Camera</button>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    
    let stream = null;
    let detector = null;
    let animationId = null;
    let lastDetectionTime = 0;
    const DETECTION_INTERVAL = 500; // ms
    
    // Load TensorFlow.js and COCO-SSD model
    async function loadModel() {
      status.textContent = 'Loading AI model (COCO-SSD)...';
      status.classList.add('loading');
      try {
        // The scripts are already loaded via <script> tags in <head>
        if (typeof cocoSsd !== 'undefined' && cocoSsd.load) {
          detector = await cocoSsd.load();
          status.textContent = 'Model loaded. Ready to start.';
          status.classList.remove('loading');
          startBtn.disabled = false;
        } else {
          throw new Error('cocoSsd is not defined');
        }
      } catch (e) {
        status.textContent = 'Error loading model: ' + e.message;
        console.error(e);
      }
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = stream;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        status.textContent = 'Camera started. Detecting...';
        detect();
      } catch (err) {
        status.textContent = 'Error accessing camera: ' + err.message;
        console.error(err);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      status.textContent = 'Camera stopped.';
    }

    async function detect() {
      if (!stream || !detector) return;
      
      // Resize canvas to match video display size
      canvas.width = video.clientWidth;
      canvas.height = video.clientHeight;
      
      const now = Date.now();
      if (now - lastDetectionTime > DETECTION_INTERVAL) {
        lastDetectionTime = now;
        
        // Draw video frame to canvas temporarily for detection
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        try {
          const predictions = await detector.detect(video);
          drawPredictions(predictions);
        } catch (e) {
          console.error('Detection error:', e);
        }
      }
      
      animationId = requestAnimationFrame(detect);
    }

    function drawPredictions(predictions) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      if (predictions.length === 0) {
        status.textContent = 'No objects detected.';
        return;
      }

      const topPrediction = predictions[0];
      status.textContent = `Detected: ${topPrediction.class} (${Math.round(topPrediction.score * 100)}%)`;

      predictions.forEach(prediction => {
        const [x, y, width, height] = prediction.bbox;
        
        // Scale bbox to canvas size if needed (COCO-SSD returns coordinates based on video element size)
        const scaleX = canvas.width / video.videoWidth;
        const scaleY = canvas.height / video.videoHeight;
        
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 4;
        ctx.strokeRect(x * scaleX, y * scaleY, width * scaleX, height * scaleY);
        
        ctx.fillStyle = '#00ffcc';
        ctx.font = '18px Arial';
        const text = `${prediction.class} (${Math.round(prediction.score * 100)}%)`;
        ctx.fillText(text, x * scaleX, y * scaleY - 5);
      });
    }

    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);

    // Start loading model immediately
    loadModel();
  </script>
</body>
</html>
