[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leap-video"
version = "1.0.0"
description = "A vertical video engine you own: topic -> captioned 9:16 video -> YouTube."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LEAP" }]
keywords = ["youtube", "shorts", "faceless", "video", "ffmpeg", "vertical"]
dependencies = []

[project.optional-dependencies]
edge = ["edge-tts>=6.1,<7"]
ffmpeg = ["imageio-ffmpeg>=0.5"]
test = ["pytest>=8"]

[project.scripts]
leap = "leap.cli:main"

[tool.setuptools]
packages = ["leap", "leap.providers"]

[tool.setuptools.package-data]
leap = ["../assets/fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
