name: Deploy to GitHub Pages
on:
  push:
    branches: [ main, arena/a8d7f9a9-a-leap ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build static site
        # Since our site is static (index.html) and server.js is for local dev,
        # we'll copy index.html and assets to a gh-pages branch.
        run: |
          mkdir -p ./gh-pages-build
          cp index.html ./gh-pages-build/
          # Copy assets if any
          if [ -d "assets" ]; then
            cp -r assets ./gh-pages-build/
          fi
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-build
          publish_branch: gh-pages
          force_orphan: true
